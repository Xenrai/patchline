[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchline"
version = "0.2.0"
description = "Diff API specs and find what breaks your code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["patchline*"]

[project.scripts]
patchline = "patchline.cli:main"
